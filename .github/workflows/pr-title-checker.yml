name: PR Title Checker

on:
  pull_request:
    types: [opened, edited, labeled]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    name: pr-title-checker
    permissions:
      pull-requests: write
    steps:
      - uses: thehanimo/pr-title-checker@b69bc3a841cf4e3cfef2d822625d8c90a588e9da # v2.0.0
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          configuration_path: '.github/pr-title-checker-config.json'
